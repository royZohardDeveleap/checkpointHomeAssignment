name: Test Service

on:
  workflow_call:
    inputs:
      service:
        description: 'Service name (service1 or service2)'
        required: true
        type: string
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.11'

jobs:
  test:
    name: Test ${{ inputs.service }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        working-directory: ./${{ inputs.service }}
        run: |
          uv pip install --system -r requirements.txt -r requirements-test.txt

      - name: Run tests with coverage
        working-directory: ./${{ inputs.service }}
        run: |
          pytest --cov=app --cov-report=term --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        continue-on-error: true
        with:
          files: ./${{ inputs.service }}/coverage.xml
          flags: ${{ inputs.service }}
          name: ${{ inputs.service }}-coverage

      - name: Generate test summary
        if: always()
        run: |
          echo "## ${{ inputs.service }} Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Python Version:** ${{ inputs.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** ${{ inputs.service }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
