name: CI Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'tasks/service1/**'
      - 'tasks/service2/**'

  pull_request:
    branches:
      - main
    paths:
      - 'tasks/service1/**'
      - 'tasks/service2/**'

  workflow_dispatch:
    inputs:
      services:
        description: 'Services to build/test (comma-separated: service1,service2 or "all")'
        required: true
        type: choice
        options:
          - all
          - service1
          - service2
          - service1,service2
      run_tests:
        description: 'Run tests before build'
        required: false
        type: boolean
        default: true
      trigger_cd:
        description: 'Trigger CD pipeline after build'
        required: false
        type: boolean
        default: false

env:
  AWS_REGION: us-east-1

jobs:
  # ============================================================================
  # DETECT CHANGED SERVICES
  # ============================================================================

  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      service1: ${{ steps.filter.outputs.service1 }}
      service2: ${{ steps.filter.outputs.service2 }}
      services: ${{ steps.set-matrix.outputs.services }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for service changes
        uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            service1:
              - 'tasks/service1/**'
            service2:
              - 'tasks/service2/**'

      - name: Build service matrix
        id: set-matrix
        run: |
          services="[]"

          # Handle manual dispatch
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            input_services="${{ github.event.inputs.services }}"

            if [ "$input_services" == "all" ]; then
              services='["service1","service2"]'
            else
              # Convert comma-separated string to JSON array
              services=$(echo "$input_services" | jq -R 'split(",") | map(select(length > 0))')
            fi
          else
            # Handle automatic triggers (push/PR)
            if [ "${{ steps.filter.outputs.service1 }}" == "true" ]; then
              services=$(echo "$services" | jq -c '. += ["service1"]')
            fi

            if [ "${{ steps.filter.outputs.service2 }}" == "true" ]; then
              services=$(echo "$services" | jq -c '. += ["service2"]')
            fi
          fi

          echo "services=$services" >> $GITHUB_OUTPUT
          echo "Services to process: $services"

  # ============================================================================
  # TEST SERVICES (MATRIX) - Only on Pull Requests
  # ============================================================================

  test:
    name: Test ${{ matrix.service }}
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.services != '[]' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.run_tests == 'true'))
    uses: ./.github/workflows/test-service.yaml

    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
      fail-fast: false

    with:
      service: tasks/${{ matrix.service }}

  # ============================================================================
  # BUILD SERVICES (MATRIX) - Only on Push to Main
  # ============================================================================

  build:
    name: Build ${{ matrix.service }}
    needs: [detect-changes, test]
    if: |
      always() &&
      needs.detect-changes.outputs.services != '[]' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (github.event_name == 'push' && github.ref == 'refs/heads/main' ||
       github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/build-service.yaml

    permissions:
      contents: write  # Required for build-service.yaml to create git tags

    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
      fail-fast: false

    with:
      service: ${{ matrix.service }}
    secrets: inherit

  # ============================================================================
  # TRIGGER CD PIPELINE
  # ============================================================================

  trigger-cd:
    name: Trigger CD Pipeline
    needs: [detect-changes, build]
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.detect-changes.outputs.services != '[]' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.trigger_cd == 'true'))
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Required for repository_dispatch
      actions: write

    steps:
      - name: Prepare services list
        id: prepare
        run: |
          # Convert JSON array to comma-separated string
          services='${{ needs.detect-changes.outputs.services }}'
          services_csv=$(echo "$services" | jq -r 'join(",")')
          echo "services_csv=$services_csv" >> $GITHUB_OUTPUT
          echo "Services to deploy: $services_csv"

      - name: Trigger CD via repository_dispatch
        uses: peter-evans/repository-dispatch@v4
        with:
          event-type: trigger-cd
          client-payload: |
            {
              "services": "${{ steps.prepare.outputs.services_csv }}",
              "project_name": "ha-roy-develeap",
              "environment": "dev",
              "triggered_by": "ci-pipeline",
              "commit_sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "workflow_run_id": "${{ github.run_id }}"
            }

  # ============================================================================
  # CI SUMMARY
  # ============================================================================

  summary:
    name: CI Summary
    needs: [detect-changes, test, build]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate CI summary
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Services Changed" >> $GITHUB_STEP_SUMMARY
          services='${{ needs.detect-changes.outputs.services }}'

          if [ "$services" == "[]" ] || [ -z "$services" ]; then
            echo "No service changes detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "$services" | jq -r '.[]' | while read service; do
              echo "- ✅ $service" >> $GITHUB_STEP_SUMMARY
            done
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Show test status if it ran (PR)
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "### Test Status" >> $GITHUB_STEP_SUMMARY
            if [ "${{ needs.test.result }}" == "success" ]; then
              echo "- ✅ Tests: PASSED" >> $GITHUB_STEP_SUMMARY
            elif [ "${{ needs.test.result }}" == "skipped" ]; then
              echo "- ⚪ Tests: SKIPPED (no changes)" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          # Show build status if it ran (push to main)
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "### Build Status" >> $GITHUB_STEP_SUMMARY
            if [ "${{ needs.build.result }}" == "success" ]; then
              echo "- ✅ Build: SUCCESS" >> $GITHUB_STEP_SUMMARY
            elif [ "${{ needs.build.result }}" == "skipped" ]; then
              echo "- ⚪ Build: SKIPPED (no changes)" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Overall status based on event type
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            if [ "${{ needs.test.result }}" == "success" ]; then
              echo "### ✅ All Tests Passed!" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Your PR is ready for review." >> $GITHUB_STEP_SUMMARY
            elif [ "${{ needs.test.result }}" == "skipped" ]; then
              echo "### ℹ️ No Changes Detected" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "No services were modified in this PR." >> $GITHUB_STEP_SUMMARY
            else
              echo "### ❌ Tests Failed" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Please check the failed test jobs for details." >> $GITHUB_STEP_SUMMARY
            fi
          else
            if [ "${{ needs.build.result }}" == "success" ]; then
              echo "### 🎉 Build Completed Successfully!" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "All changed services have been built." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "CD pipeline will be triggered automatically." >> $GITHUB_STEP_SUMMARY
            elif [ "${{ needs.build.result }}" == "skipped" ]; then
              echo "### ℹ️ No Changes Detected" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "No services were modified in this push." >> $GITHUB_STEP_SUMMARY
            else
              echo "### ⚠️ Build Failed" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Please check the failed jobs for details." >> $GITHUB_STEP_SUMMARY
            fi
          fi
