name: CI Pipeline

on:
#   push:
#     branches:
#       - main
#     paths:
#       - 'tasks/service1/**'
#       - 'tasks/service2/**'

#   pull_request:
#     branches:
#       - main
#     paths:
#       - 'tasks/service1/**'
#       - 'tasks/service2/**'

  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  # ============================================================================
  # DETECT CHANGED SERVICES
  # ============================================================================

  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      service1: ${{ steps.filter.outputs.service1 }}
      service2: ${{ steps.filter.outputs.service2 }}
      services: ${{ steps.set-matrix.outputs.services }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for service changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            service1:
              - 'tasks/service1/**'
            service2:
              - 'tasks/service2/**'

      - name: Build service matrix
        id: set-matrix
        run: |
          services="[]"

          if [ "${{ steps.filter.outputs.service1 }}" == "true" ]; then
            services=$(echo "$services" | jq -c '. += ["service1"]')
          fi

          if [ "${{ steps.filter.outputs.service2 }}" == "true" ]; then
            services=$(echo "$services" | jq -c '. += ["service2"]')
          fi

          echo "services=$services" >> $GITHUB_OUTPUT
          echo "Services to build: $services"

  # ============================================================================
  # BUILD SERVICES (MATRIX)
  # ============================================================================

  build:
    name: Build ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    uses: ./.github/workflows/build-service.yaml

    permissions:
      contents: write  # Required for build-service.yaml to create git tags

    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
      fail-fast: false

    with:
      service: ${{ matrix.service }}
    secrets: inherit

  # ============================================================================
  # TRIGGER CD PIPELINE
  # ============================================================================

  trigger-cd:
    name: Trigger CD Pipeline
    needs: [detect-changes, build]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger CD workflow
        uses: actions/github-script@v7
        with:
          script: |
            // Get the list of services that were built successfully
            const services = JSON.parse('${{ needs.detect-changes.outputs.services }}');

            if (services.length > 0) {
              console.log(`Triggering CD for: ${services.join(', ')}`);

              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'cd-pipeline.yaml',
                ref: 'main',
                inputs: {
                  services: services.join(','),
                  triggered_by: 'ci-pipeline'
                }
              });
            } else {
              console.log('No services to deploy');
            }

  # ============================================================================
  # CI SUMMARY
  # ============================================================================

  summary:
    name: CI Summary
    needs: [detect-changes, build]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate CI summary
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Services Changed" >> $GITHUB_STEP_SUMMARY
          services='${{ needs.detect-changes.outputs.services }}'

          if [ "$services" == "[]" ] || [ -z "$services" ]; then
            echo "No service changes detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "$services" | jq -r '.[]' | while read service; do
              echo "- ✅ $service" >> $GITHUB_STEP_SUMMARY
            done
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Status" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "- ✅ Build: SUCCESS" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.build.result }}" == "skipped" ]; then
            echo "- ⚪ Build: SKIPPED (no changes)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Overall status
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "### 🎉 CI Completed Successfully!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All changed services have been built." >> $GITHUB_STEP_SUMMARY

            if [ "${{ github.ref }}" == "refs/heads/main" ] && [ "${{ github.event_name }}" == "push" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "CD pipeline will be triggered automatically." >> $GITHUB_STEP_SUMMARY
            fi
          elif [ "${{ needs.build.result }}" == "skipped" ]; then
            echo "### ℹ️ No Changes Detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No services were modified in this push." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ CI Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please check the failed jobs for details." >> $GITHUB_STEP_SUMMARY
          fi
