name: Build and Deploy Grafana

on:
  workflow_dispatch:
    inputs:
      admin_password:
        description: 'Grafana admin password (enter to overwrite current or create new)'
        required: false
        type: string
      image_tag:
        description: 'Docker image tag (leave empty to use git commit SHA)'
        required: false
        type: string


env:
  AWS_REGION: us-east-1
  PROJECT: ha-roy-develeap
  ENV: dev

jobs:
  build-and-push:
    name: Build and Push Grafana Image
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      image_tag: ${{ steps.image-tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Handle admin password
        id: handle-password
        run: |
          PARAM_NAME="/${{ env.PROJECT }}/${{ env.ENV }}/grafana/admin-password"

          # Check if password input was provided
          if [ -n "${{ github.event.inputs.admin_password }}" ]; then
            # Password provided - store/update it
            PASSWORD="${{ github.event.inputs.admin_password }}"
            echo "::add-mask::$PASSWORD"
            echo "password=$PASSWORD" >> $GITHUB_OUTPUT
            echo "action=update" >> $GITHUB_OUTPUT
          else
            # No password provided - check if parameter exists
            if aws ssm get-parameter --name "$PARAM_NAME" --region ${{ env.AWS_REGION }} >/dev/null 2>&1; then
              echo "Password parameter exists, skipping password update"
              echo "action=skip" >> $GITHUB_OUTPUT
            else
              echo "❌ Error: No password provided and parameter does not exist"
              echo "Please provide admin_password input to create the parameter"
              exit 1
            fi
          fi

      - name: Store admin password in SSM
        if: steps.handle-password.outputs.action == 'update'
        run: |
          aws ssm put-parameter \
            --name "/${{ env.PROJECT }}/${{ env.ENV }}/grafana/admin-password" \
            --value "${{ steps.handle-password.outputs.password }}" \
            --type "SecureString" \
            --overwrite \
            --description "Grafana admin password"

      - name: Get image tag
        id: image-tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            # Use git commit SHA as tag
            TAG=$(git rev-parse --short HEAD)
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Image tag: $TAG"

      - name: Build Grafana image
        working-directory: tasks/grafana
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          docker build \
            --tag $ECR_REGISTRY/${{ env.PROJECT }}/${{ env.ENV }}/grafana:$IMAGE_TAG \
            --tag $ECR_REGISTRY/${{ env.PROJECT }}/${{ env.ENV }}/grafana:latest \
            .

      - name: Push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          docker push $ECR_REGISTRY/${{ env.PROJECT }}/${{ env.ENV }}/grafana:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.PROJECT }}/${{ env.ENV }}/grafana:latest

      - name: Update SSM parameter with image tag
        run: |
          aws ssm put-parameter \
            --name "/${{ env.PROJECT }}/${{ env.ENV }}/grafana/image-tag" \
            --value "${{ steps.image-tag.outputs.tag }}" \
            --type "String" \
            --overwrite \
            --description "Grafana container image tag"

  # ============================================================================
  # DEPLOY MONITORING (TERRAFORM)
  # ============================================================================

  deploy-monitoring:
    name: Deploy Grafana Service
    needs: build-and-push
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: terraform/monitoring

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Wait for ECS service stability
        run: |
          echo "Waiting for Grafana service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.PROJECT }}-${{ env.ENV }}-cluster \
            --services ${{ env.PROJECT }}-${{ env.ENV }}-grafana \
            --region ${{ env.AWS_REGION }}

      - name: Get ALB DNS
        id: alb-info
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --query "LoadBalancers[?contains(LoadBalancerName, '${{ env.PROJECT }}-${{ env.ENV }}')].DNSName" \
            --output text \
            --region ${{ env.AWS_REGION }})
          echo "alb_dns=$ALB_DNS" >> $GITHUB_OUTPUT

      - name: Generate deployment summary
        run: |
          echo "## 🚀 Grafana Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Deployed and Healthy" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** ${{ needs.build-and-push.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Grafana URL:** http://${{ steps.alb-info.outputs.alb_dns }}/grafana" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Access Grafana" >> $GITHUB_STEP_SUMMARY
          echo "1. Open: http://${{ steps.alb-info.outputs.alb_dns }}/grafana" >> $GITHUB_STEP_SUMMARY
          echo "2. Login with username: \`admin\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Retrieve password from SSM:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "aws ssm get-parameter \\" >> $GITHUB_STEP_SUMMARY
          echo "  --name '/${{ env.PROJECT }}/${{ env.ENV }}/grafana/admin-password' \\" >> $GITHUB_STEP_SUMMARY
          echo "  --with-decryption \\" >> $GITHUB_STEP_SUMMARY
          echo "  --query 'Parameter.Value' \\" >> $GITHUB_STEP_SUMMARY
          echo "  --output text" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "## ⚠️ Grafana Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the workflow logs for details." >> $GITHUB_STEP_SUMMARY
