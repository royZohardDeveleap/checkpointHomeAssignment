name: Build and Push Docker Image to ECR

on:
  workflow_call:
    inputs:
      service:
        description: 'Service to build (service1 or service2)'
        required: true
        type: string
      project_name:
        description: 'Name of the project'
        required: true
        type: string
        default: ha-roy-develeap
      environment:
        description: 'Environment of the project'
        required: true
        type: string
        default: dev
    outputs:
      image_tag:
        description: 'The Docker image tag that was built'
        value: ${{ jobs.build-and-push.outputs.image_tag }}
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_ACCOUNT_ID:
        required: true

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: ${{ inputs.project_name }}-${{ inputs.environment }}-${{ inputs.service }}

jobs:
  build-and-push:
    name: Build and Push ${{ inputs.service }} to ECR
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Need write permission to create git tags

    outputs:
      image_tag: ${{ steps.version.outputs.version }}

    steps:
      # ========================================================================
      # CHECKOUT CODE
      # ========================================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for semantic versioning

      # ========================================================================
      # CONFIGURE AWS CREDENTIALS
      # ========================================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ========================================================================
      # LOGIN TO ECR
      # ========================================================================

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ========================================================================
      # CALCULATE VERSION
      # ========================================================================

      - name: Calculate semantic version
        id: version
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          # Auto-generate semantic version based on git tags and PR merges
          # Tag format: service1-v1.2.3, service2-v1.0.5, grafana-v2.1.0
          GIT_SHA="${{ github.sha }}"
          SHORT_SHA="${GIT_SHA:0:7}"

          # Try to get the latest semantic version tag for this service
          LATEST_TAG=$(git describe --tags --abbrev=0 --match "${SERVICE}-v[0-9]*.[0-9]*.[0-9]*" 2>/dev/null || echo "")

          if [ -n "${LATEST_TAG}" ]; then
            # Parse the latest tag (e.g., service1-v1.2.3)
            # Remove service prefix and 'v' to get version number
            TAG_VERSION="${LATEST_TAG#${SERVICE}-v}"
            MAJOR=$(echo ${TAG_VERSION} | cut -d. -f1)
            MINOR=$(echo ${TAG_VERSION} | cut -d. -f2)
            PATCH=$(echo ${TAG_VERSION} | cut -d. -f3)

            # Count commits since the last tag
            COMMITS_SINCE=$(git rev-list ${LATEST_TAG}..HEAD --count)

            if [ "${COMMITS_SINCE}" -eq 0 ]; then
              # We're exactly on a tag
              VERSION="${TAG_VERSION}"
            else
              # Auto-increment version for each PR merge
              # Look for version bump indicators in commit messages
              COMMIT_MESSAGES=$(git log ${LATEST_TAG}..HEAD --pretty=format:"%s")

              # Check for breaking changes (MAJOR bump)
              if echo "$COMMIT_MESSAGES" | grep -qiE "(BREAKING CHANGE|major:)"; then
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                VERSION="${MAJOR}.${MINOR}.${PATCH}"
              # Check for new features (MINOR bump)
              elif echo "$COMMIT_MESSAGES" | grep -qiE "(feat:|feature:|minor:)"; then
                MINOR=$((MINOR + 1))
                PATCH=0
                VERSION="${MAJOR}.${MINOR}.${PATCH}"
              # Default: patch bump for bug fixes, chores, etc.
              else
                PATCH=$((PATCH + 1))
                VERSION="${MAJOR}.${MINOR}.${PATCH}"
              fi
            fi
          else
            # No tags found for this service - this is the FIRST PR merge
            # Start with v1.0.0
            VERSION="1.0.0"
          fi

          echo "Auto-generated semantic version for ${SERVICE}: ${VERSION}"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

          # Also output major.minor.patch for reference
          BASE_VERSION=$(echo ${VERSION} | sed 's/-.*//g' | sed 's/+.*//g')
          echo "base_version=${BASE_VERSION}" >> $GITHUB_OUTPUT


      # ========================================================================
      # BUILD AND PUSH IMAGE
      # ========================================================================
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./tasks/${{ inputs.service }}
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{env.ECR_REPOSITORY}}:${{steps.version.outputs.version}}


      # ========================================================================
      # STORE IMAGE TAG IN SSM PARAMETER STORE
      # ========================================================================

      - name: Store image tag in SSM Parameter Store
        env:
          SERVICE: ${{ inputs.service }}
          IMAGE_TAG: ${{ steps.version.outputs.version }}
          PARAMETER_NAME: /${{ inputs.project_name }}/${{ inputs.environment }}/${{ inputs.service }}/image-tag
        run: |
          echo "Storing image tag in SSM Parameter Store..."
          aws ssm put-parameter \
            --name "${PARAMETER_NAME}" \
            --value "${IMAGE_TAG}" \
            --type String \
            --overwrite \
            --region ${{ env.AWS_REGION }}

          echo "✓ Stored ${SERVICE}:${IMAGE_TAG} in ${PARAMETER_NAME}"

      # ========================================================================
      # CREATE GIT TAG
      # ========================================================================

      - name: Create and push git tag
        env:
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ steps.version.outputs.version }}
          GIT_TAG: ${{ inputs.service }}-v${{ steps.version.outputs.version }}
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if tag already exists
          if git rev-parse "${GIT_TAG}" >/dev/null 2>&1; then
            echo "Tag ${GIT_TAG} already exists, skipping tag creation"
          else
            echo "Creating git tag: ${GIT_TAG}"

            # Create annotated tag with message
            git tag -a "${GIT_TAG}" -m "Release ${SERVICE} version ${VERSION}" \
              -m "" \
              -m "Built and deployed via GitHub Actions" \
              -m "Image: ${{ env.ECR_REGISTRY }}/${{ inputs.project_name }}-${{ inputs.environment }}-${SERVICE}:${VERSION}" \
              -m "Commit: ${{ github.sha }}"

            git push origin "${GIT_TAG}"
            echo "✓ Git tag ${GIT_TAG} created and pushed"
          fi

      # ========================================================================
      # SUMMARY
      # ========================================================================

      - name: Output summary
        env:
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ steps.version.outputs.version }}
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
          ECR_REPO_NAME: ${{ inputs.project_name }}-${{ inputs.environment }}-${{ inputs.service }}
          PARAMETER_NAME: /${{ inputs.project_name }}/${{ inputs.environment }}/${{ inputs.service }}/image-tag
          GIT_TAG: ${{ inputs.service }}-v${{ steps.version.outputs.version }}
        run: |
          IMAGE_URI="${{ env.ECR_REGISTRY }}/${ECR_REPO_NAME}:${VERSION}"

          echo "## Build Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** ${SERVICE}" >> $GITHUB_STEP_SUMMARY
          echo "**Semantic Version:** ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**Git Tag:** ${GIT_TAG}" >> $GITHUB_STEP_SUMMARY
          echo "**Base Version:** ${BASE_VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**Git SHA:** ${SHORT_SHA}" >> $GITHUB_STEP_SUMMARY
          echo "**Image URI:** \`${IMAGE_URI}\`" >> $GITHUB_STEP_SUMMARY
          echo "**SSM Parameter:** ${PARAMETER_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Status" >> $GITHUB_STEP_SUMMARY
          echo "✅ Tests passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Image built and pushed to ECR" >> $GITHUB_STEP_SUMMARY
          echo "✅ Version stored in SSM Parameter Store" >> $GITHUB_STEP_SUMMARY
          echo "✅ Git tag created: \`${GIT_TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployment workflow will use this version automatically" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Semantic Versioning" >> $GITHUB_STEP_SUMMARY
          echo "This version follows [Semantic Versioning 2.0.0](https://semver.org/)" >> $GITHUB_STEP_SUMMARY
          echo "- Each service has independent versioning" >> $GITHUB_STEP_SUMMARY
          echo "- Git tags use format: \`${SERVICE}-vMAJOR.MINOR.PATCH\`" >> $GITHUB_STEP_SUMMARY
          echo "- Version calculated based on commit messages since last tag" >> $GITHUB_STEP_SUMMARY
