name: CD Pipeline

on:
  repository_dispatch:
    types: [trigger-cd]  # Custom event type for CI pipeline
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to deploy (comma-separated: service1,service2 or "all")'
        required: true
        type: string
        default: 'all'
      project_name:
        description: 'Name of the project'
        required: true
        type: string
        default: ha-roy-develeap
      environment:
        description: 'Environment to deploy to'
        required: false
        type: string
        default: 'dev'
      triggered_by:
        description: 'Triggered by (internal use)'
        required: false
        type: string
        default: 'manual'


env:
  AWS_REGION: us-east-1

jobs:
  # ============================================================================
  # DETERMINE SERVICES TO DEPLOY
  # ============================================================================

  determine-services:
    name: Determine Services to Deploy
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.build-matrix.outputs.services }}

    steps:
      - name: Build service matrix
        id: build-matrix
        run: |
          # Read from inputs (workflow_dispatch) or client_payload (repository_dispatch)
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            SERVICES="${{ github.event.client_payload.services }}"
            echo "Triggered via repository_dispatch"
            echo "Services from payload: $SERVICES"
          else
            SERVICES="${{ inputs.services }}"
            echo "Triggered via workflow_dispatch"
            echo "Services from inputs: $SERVICES"
          fi

          services="[]"

          if [ "$SERVICES" == "all" ]; then
            services='["service1","service2"]'
            echo "Deploying all services"
          else
            # Parse comma-separated list
            if echo "$SERVICES" | grep -q "service1"; then
              services=$(echo "$services" | jq -c '. += ["service1"]')
              echo "Adding service1 to deploy"
            fi

            if echo "$SERVICES" | grep -q "service2"; then
              services=$(echo "$services" | jq -c '. += ["service2"]')
              echo "Adding service2 to deploy"
            fi
          fi

          echo "services=$services" >> $GITHUB_OUTPUT
          echo "Services to deploy: $services"

  # ============================================================================
  # DEPLOY SERVICES (MATRIX)
  # ============================================================================

  deploy:
    name: Deploy ${{ matrix.service }}
    needs: determine-services
    if: needs.determine-services.outputs.services != '[]'
    uses: ./.github/workflows/deploy-service.yaml

    strategy:
      matrix:
        service: ${{ fromJson(needs.determine-services.outputs.services) }}
      fail-fast: false
      max-parallel: 2

    with:
      service: ${{ matrix.service }}
    secrets: inherit

  # ============================================================================
  # CD SUMMARY
  # ============================================================================

  summary:
    name: CD Summary
    needs: [determine-services, deploy]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate CD summary
        run: |
          echo "## CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY

          # Read from inputs (workflow_dispatch) or client_payload (repository_dispatch)
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            PROJECT_NAME="${{ github.event.client_payload.project_name }}"
            ENVIRONMENT="${{ github.event.client_payload.environment }}"
            TRIGGERED_BY="${{ github.event.client_payload.triggered_by }}"
            COMMIT_SHA="${{ github.event.client_payload.commit_sha }}"
          else
            PROJECT_NAME="${{ inputs.project_name }}"
            ENVIRONMENT="${{ inputs.environment }}"
            TRIGGERED_BY="${{ inputs.triggered_by }}"
            COMMIT_SHA="${{ github.sha }}"
          fi

          echo "**Project Name:** ${PROJECT_NAME:-ha-roy-develeap}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${ENVIRONMENT:-dev}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${TRIGGERED_BY:-manual}" >> $GITHUB_STEP_SUMMARY

          if [ -n "$COMMIT_SHA" ] && [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "**Source Commit:** \`${COMMIT_SHA}\`" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Services Deployed" >> $GITHUB_STEP_SUMMARY
          services='${{ needs.determine-services.outputs.services }}'

          if [ "$services" == "[]" ] || [ -z "$services" ]; then
            echo "No services selected for deployment" >> $GITHUB_STEP_SUMMARY
          else
            echo "$services" | jq -r '.[]' | while read service; do
              echo "- ✅ $service" >> $GITHUB_STEP_SUMMARY
            done
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Status" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "- ✅ Deploy: SUCCESS" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy.result }}" == "skipped" ]; then
            echo "- ⚪ Deploy: SKIPPED (no services)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Deploy: ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Overall status
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "### 🎉 CD Completed Successfully!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All selected services have been deployed to ECS." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy.result }}" == "skipped" ]; then
            echo "### ℹ️ No Services Deployed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No services were selected for deployment." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ CD Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please check the failed jobs for details." >> $GITHUB_STEP_SUMMARY
          fi
